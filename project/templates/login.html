{% extends "base.html" %}
{% block title %}Login · Sprint Tracker{% endblock %}

{% block content %}
  <div class="hero">
    <div class="hero__copy">
      <h1>Welcome back</h1>
      <p class="muted">
        Log in with your username and password to access your role-based dashboard.
      </p>
      <div class="hint">
        <div class="hint__title">Default users</div>
        <div class="hint__grid">
          <span class="pill">manager</span>
          <span class="pill">dev1</span>
          <span class="pill">dev2</span>
          <span class="pill">tester</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card__title">Login</h2>
      <form method="post" class="form">
        <label class="field">
          <span class="field__label">Username</span>
          <input
            class="input"
            type="text"
            name="username"
            placeholder="e.g. manager"
            value="{{ username or '' }}"
            autocomplete="username"
            required
          />
        </label>
        <label class="field">
          <span class="field__label">Password</span>
          <input
            class="input"
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </label>
        <button class="btn btn--primary" type="submit">Login</button>
      </form>
      <p class="muted" style="margin-top:14px;text-align:center">
        Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
      </p>
    </div>
  </div>
{% endblock %}
