{% extends "base.html" %}
{% block title %}Sign Up · Sprint Tracker{% endblock %}

{% block content %}
  <div class="hero">
    <div class="hero__copy">
      <h1>Create an account</h1>
      <p class="muted">
        Register a new user to start managing sprints, tasks, and bugs.
      </p>
      <div class="hint">
        <div class="hint__title">Available roles</div>
        <div class="hint__grid">
          <span class="pill">Manager</span>
          <span class="pill">Developer</span>
          <span class="pill">Tester</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card__title">Sign Up</h2>
      <form method="post" class="form">
        <label class="field">
          <span class="field__label">Username (min. 3 characters)</span>
          <input
            class="input"
            type="text"
            name="username"
            placeholder="Choose a username"
            value="{{ username or '' }}"
            autocomplete="username"
            minlength="3"
            required
          />
        </label>
        <label class="field">
          <span class="field__label">Password (min. 6 characters)</span>
          <input
            class="input"
            type="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </label>
        <label class="field">
          <span class="field__label">Confirm password</span>
          <input
            class="input"
            type="password"
            name="confirm_password"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </label>
        <label class="field">
          <span class="field__label">Role</span>
          <select class="select" name="role" required>
            <option value="" disabled {% if not role %}selected{% endif %}>Select a role…</option>
            <option value="Manager" {% if role == 'Manager' %}selected{% endif %}>Manager</option>
            <option value="Developer" {% if role == 'Developer' %}selected{% endif %}>Developer</option>
            <option value="Tester" {% if role == 'Tester' %}selected{% endif %}>Tester</option>
          </select>
        </label>
        <button class="btn btn--primary" type="submit">Create account</button>
      </form>
      <p class="muted" style="margin-top:14px;text-align:center">
        Already have an account? <a href="{{ url_for('login_get') }}">Log in</a>
      </p>
    </div>
  </div>
{% endblock %}
